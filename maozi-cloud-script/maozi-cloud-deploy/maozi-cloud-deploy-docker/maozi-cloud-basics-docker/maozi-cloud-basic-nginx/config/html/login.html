<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>登录 · maozi-cloud</title>
<style>
  :root {
    --bg-0: #070b18;
    --bg-1: #0b1226;
    --card: rgba(17, 26, 48, 0.72);
    --card-border: rgba(120, 160, 255, 0.16);
    --text-1: #eef2ff;
    --text-2: #9aa7c7;
    --text-3: #5f6c8f;
    --accent-1: #5b8cff;
    --accent-2: #8b5cf6;
    --accent-3: #22d3ee;
    --field: rgba(10, 16, 34, 0.65);
    --field-border: rgba(120, 160, 255, 0.20);
    --danger: #f87171;
    --danger-bg: rgba(248, 113, 113, 0.10);
    --danger-border: rgba(248, 113, 113, 0.35);
    --ok: #34d399;
    --ok-bg: rgba(52, 211, 153, 0.10);
    --ok-border: rgba(52, 211, 153, 0.32);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg-0);
    color: var(--text-1);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- 背景 ---------- */
  .bg {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(1200px 800px at 80% -10%, rgba(91, 140, 255, 0.16), transparent 60%),
      radial-gradient(1000px 700px at -10% 110%, rgba(139, 92, 246, 0.14), transparent 60%),
      linear-gradient(160deg, var(--bg-1) 0%, var(--bg-0) 55%, #05070f 100%);
  }
  .bg::after {
    content: "";
    position: absolute; inset: -50%;
    background-image:
      linear-gradient(rgba(120, 160, 255, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120, 160, 255, 0.05) 1px, transparent 1px);
    background-size: 56px 56px;
    transform: perspective(600px) rotateX(38deg) translateY(18%);
    mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 30%, transparent 75%);
  }

  .orb {
    position: fixed; border-radius: 50%;
    filter: blur(90px); z-index: 0; opacity: 0.5;
    animation: drift 18s ease-in-out infinite alternate;
  }
  .orb-1 { width: 420px; height: 420px; top: -120px; left: -80px;  background: rgba(91, 140, 255, 0.35); }
  .orb-2 { width: 360px; height: 360px; bottom: -140px; right: -60px; background: rgba(34, 211, 238, 0.22); animation-delay: -6s; animation-duration: 22s; }
  .orb-3 { width: 300px; height: 300px; top: 55%; left: 62%; background: rgba(139, 92, 246, 0.25); animation-delay: -12s; animation-duration: 26s; }

  @keyframes drift {
    0%   { transform: translate(0, 0) scale(1); }
    100% { transform: translate(50px, -36px) scale(1.12); }
  }

  /* ---------- 卡片 ---------- */
  .card {
    position: relative; z-index: 1;
    width: 100%; max-width: 420px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    padding: 48px 42px 36px;
    text-align: center;
    backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    box-shadow: 0 32px 80px rgba(2, 6, 20, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    animation: card-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes card-in {
    from { opacity: 0; transform: translateY(26px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .card::before {
    content: "";
    position: absolute; top: -1px; left: 15%;
    width: 70%; height: 1px;
    background: linear-gradient(90deg, transparent,
                rgba(91, 140, 255, 0.9), rgba(34, 211, 238, 0.9), transparent);
  }

  /* ---------- 顶部徽标 ---------- */
  .badge {
    width: 76px; height: 76px;
    margin: 0 auto 22px;
    border-radius: 22px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(145deg, rgba(91, 140, 255, 0.16), rgba(139, 92, 246, 0.10));
    border: 1px solid rgba(120, 160, 255, 0.25);
    box-shadow: 0 12px 32px rgba(91, 140, 255, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.10);
  }
  .badge svg { width: 38px; height: 38px; display: block; }

  .title { font-size: 22px; font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; }
  .subtitle { color: var(--text-2); font-size: 13.5px; line-height: 1.7; margin-bottom: 26px; }
  .subtitle b { color: var(--text-1); font-weight: 600; }

  /* ---------- 提示横幅 ---------- */
  .banner {
    display: none;
    align-items: center; gap: 10px;
    text-align: left;
    font-size: 13px; line-height: 1.5;
    padding: 11px 14px;
    border-radius: 12px;
    margin-bottom: 22px;
    animation: slide-in 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .banner svg { width: 16px; height: 16px; flex: none; }
  .banner.error { color: #fca5a5; background: var(--danger-bg); border: 1px solid var(--danger-border); }
  .banner.ok    { color: #6ee7b7; background: var(--ok-bg);    border: 1px solid var(--ok-border); }
  /* 仅当 JS 按需追加 .show 时显示, 页面初始不弹出任何横幅 */
  .banner.show  { display: flex; }

  @keyframes slide-in {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------- 表单 ---------- */
  form { text-align: left; }

  .field { margin-bottom: 16px; }

  .field label {
    display: block;
    font-size: 12.5px; font-weight: 600;
    letter-spacing: 1px;
    color: var(--text-2);
    margin: 0 2px 8px;
  }

  .control { position: relative; }

  .control .lead {
    position: absolute; left: 14px; top: 50%;
    transform: translateY(-50%);
    width: 17px; height: 17px;
    color: var(--text-3);
    pointer-events: none;
    transition: color 0.2s ease;
  }

  .control input {
    width: 100%;
    padding: 13px 44px 13px 42px;
    font-size: 14.5px;
    font-family: inherit;
    color: var(--text-1);
    background: var(--field);
    border: 1px solid var(--field-border);
    border-radius: 12px;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    caret-color: var(--accent-3);
  }

  .control input::placeholder { color: var(--text-3); }

  .control input:hover { border-color: rgba(120, 160, 255, 0.35); }

  .control input:focus {
    border-color: var(--accent-1);
    background: rgba(10, 16, 34, 0.85);
    box-shadow: 0 0 0 4px rgba(91, 140, 255, 0.15), 0 8px 24px rgba(2, 6, 20, 0.4);
  }

  .control:focus-within .lead { color: var(--accent-1); }

  /* 密码可见切换 */
  .toggle-pass {
    position: absolute; right: 8px; top: 50%;
    transform: translateY(-50%);
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    background: none; border: none;
    border-radius: 8px;
    color: var(--text-3);
    cursor: pointer;
    transition: color 0.2s ease, background 0.2s ease;
  }
  .toggle-pass:hover { color: var(--text-1); background: rgba(120, 160, 255, 0.10); }
  .toggle-pass svg { width: 17px; height: 17px; }
  .toggle-pass .eye-off { display: none; }
  .toggle-pass.show .eye-on  { display: none; }
  .toggle-pass.show .eye-off { display: block; }

  /* 空值校验失败抖动 */
  .control.shake { animation: shake 0.45s ease; }
  .control.shake input { border-color: var(--danger); }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-7px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(2px); }
  }

  /* ---------- 提交按钮 ---------- */
  .submit {
    width: 100%;
    margin-top: 8px;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 4px;
    font-family: inherit;
    color: #fff;
    background: linear-gradient(135deg, var(--accent-1) 0%, var(--accent-2) 100%);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 12px;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 10px 26px rgba(91, 140, 255, 0.35);
    transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
  }
  .submit:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 16px 34px rgba(91, 140, 255, 0.48);
    filter: brightness(1.06);
  }
  .submit:active:not(:disabled) { transform: translateY(0); }
  .submit:disabled { opacity: 0.72; cursor: wait; }

  .spinner {
    width: 15px; height: 15px;
    border: 2px solid rgba(255, 255, 255, 0.35);
    border-top-color: #fff;
    border-radius: 50%;
    display: none;
    animation: spin 0.7s linear infinite;
  }
  .submit.loading .spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- 辅助行 ---------- */
  .aux {
    margin-top: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12.5px;
    color: var(--text-3);
  }
  .aux a {
    display: inline-flex; align-items: center; gap: 4px;
    color: var(--text-2); text-decoration: none; transition: color 0.2s ease;
  }
  .aux a:hover { color: var(--accent-3); }
  .aux a svg { width: 13px; height: 13px; }

  .footer {
    margin-top: 28px;
    padding-top: 18px;
    border-top: 1px dashed rgba(120, 160, 255, 0.18);
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--text-3);
    text-transform: uppercase;
  }
  .footer b {
    background: linear-gradient(90deg, var(--accent-1), var(--accent-3));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 700;
  }

  @media (max-width: 480px) {
    .card { padding: 40px 24px 28px; border-radius: 20px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .orb, .card, .banner, .control.shake { animation: none; }
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<main class="card">

  <div class="badge" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="url(#lg)" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round">
      <defs>
        <linearGradient id="lg" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#8fb0ff"/>
          <stop offset="1" stop-color="#22d3ee"/>
        </linearGradient>
      </defs>
      <path d="M12 2.5l8 3v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10v-6z"/>
      <path d="M8.8 12l2.2 2.2 4.2-4.4"/>
    </svg>
  </div>

  <h1 class="title">控制台登录</h1>
  <p class="subtitle" id="subtitle">该区域受访问控制保护<br>请使用管理员分配的账号登录</p>

  <div class="banner error" id="banner-error" role="alert">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/>
    </svg>
    <span>账号或密码错误，请重新输入</span>
  </div>

  <div class="banner ok" id="banner-logout" role="status">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"/><path d="M22 4L12 14l-3-3"/>
    </svg>
    <span>已安全退出，可重新登录</span>
  </div>

  <form id="login-form" method="post" action="/_auth/login" novalidate>
    <input type="hidden" name="redirect" id="redirect" value="">
    <input type="hidden" name="service" id="service" value="">
    <input type="hidden" name="app" id="app" value="">
    <input type="hidden" name="rsig" id="rsig" value="">

    <div class="field">
      <label for="username">账号</label>
      <div class="control" id="c-user">
        <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
        <input type="text" id="username" name="username" placeholder="请输入账号"
               autocomplete="username" spellcheck="false" autofocus>
      </div>
    </div>

    <div class="field">
      <label for="password">密码</label>
      <div class="control" id="c-pass">
        <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/>
          <path d="M8 10.5V7.6a4 4 0 0 1 8 0v2.9"/>
        </svg>
        <input type="password" id="password" name="password" placeholder="请输入密码"
               autocomplete="current-password">
        <button type="button" class="toggle-pass" id="toggle-pass" aria-label="显示或隐藏密码">
          <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>
          </svg>
          <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.4 10.4 0 0 1 12 19c-7 0-11-7-11-7a19.8 19.8 0 0 1 5.06-5.94"/>
            <path d="M9.9 4.24A9.6 9.6 0 0 1 12 4c7 0 11 8 11 8a19.8 19.8 0 0 1-3.22 4.31"/>
            <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/>
          </svg>
        </button>
      </div>
    </div>

    <button type="submit" class="submit" id="submit-btn">
      <span class="spinner" aria-hidden="true"></span>
      <span>登 录</span>
    </button>
  </form>

  <div class="aux">
    <span id="ttl-hint"></span>
    <a href="/" title="返回服务导航页">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
      </svg>
      返回路由页面
    </a>
  </div>

  <div class="footer"><b>maozi-cloud</b> · Secure Gateway · Internal Only</div>

</main>

<script>
  var qs = new URLSearchParams(location.search);

  // 服务端结果回显: error=1 登录失败 / logout=1 已登出
  if (qs.get('error'))  document.getElementById('banner-error').classList.add('show');
  if (qs.get('logout')) document.getElementById('banner-logout').classList.add('show');

  // 受保护服务名 (guard 跳转时带上, 仅用于展示; textContent 防注入)
  var service = qs.get('service');
  if (service) {
    var name = document.createElement('b');
    name.textContent = service;
    var sub = document.getElementById('subtitle');
    sub.textContent = '正在访问 ';
    sub.appendChild(name);
    sub.appendChild(document.createTextNode('，请先完成身份验证'));
    document.getElementById('service').value = service;
  }

  // 会话有效期 (guard 跳转时带 ttl 秒数, 与 nginx set $form_auth_session_ttl 一致)
  var ttl = parseInt(qs.get('ttl'), 10);
  if (ttl > 0) {
    var hint;
    if (ttl % 86400 === 0)       hint = (ttl / 86400) + ' 天';
    else if (ttl % 3600 === 0)   hint = (ttl / 3600) + ' 小时';
    else if (ttl % 60 === 0)     hint = (ttl / 60) + ' 分钟';
    else                         hint = ttl + ' 秒';
    document.getElementById('ttl-hint').textContent = '会话有效期 ' + hint;
  }

  // 应用标识 (guard 跳转时带上, 决定用哪组账号密码校验; 服务端强校验)
  var app = qs.get('app') || '';
  if (/^[a-z][a-z0-9_]*$/.test(app)) {
    document.getElementById('app').value = app;

    // 无服务名时展示应用标识 (自动注册模式下不再单独传服务名)
    if (!qs.get('service')) {
      var sub = document.getElementById('subtitle');
      sub.textContent = '正在访问应用 ';
      var b = document.createElement('b');
      b.textContent = app;
      sub.appendChild(b);
      sub.appendChild(document.createTextNode('，请先完成身份验证'));
    }
  }

  // 回跳签名 (guard 签发, 服务端验签; 决定登录成功后能否回跳原地址)
  var rsig = qs.get('rsig') || '';
  if (/^[0-9a-f]{40}$/.test(rsig)) document.getElementById('rsig').value = rsig;

  // 回跳目标: 前端仅做站内路径基本校验, 前缀白名单由服务端强校验
  var redirect = qs.get('redirect') || '';
  if (redirect.charAt(0) !== '/' || redirect.charAt(1) === '/') redirect = '';
  document.getElementById('redirect').value = redirect;

  // 密码可见切换
  var toggle = document.getElementById('toggle-pass');
  toggle.addEventListener('click', function () {
    var input = document.getElementById('password');
    var show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    toggle.classList.toggle('show', show);
    input.focus();
  });

  // 提交: 非空校验 (抖动提示) + 按钮 loading 态
  document.getElementById('login-form').addEventListener('submit', function (e) {
    var user = document.getElementById('username');
    var pass = document.getElementById('password');
    var cu = document.getElementById('c-user');
    var cp = document.getElementById('c-pass');
    var empty = false;

    [user, pass].forEach(function (input) { input.parentElement.classList.remove('shake'); });

    if (!user.value.trim()) { void cu.offsetWidth; cu.classList.add('shake'); empty = true; }
    if (!pass.value)        { void cp.offsetWidth; cp.classList.add('shake'); empty = true; }

    if (empty) {
      e.preventDefault();
      (user.value.trim() ? pass : user).focus();
      return;
    }

    var btn = document.getElementById('submit-btn');
    btn.classList.add('loading');
    btn.disabled = true;
  });
</script>

</body>
</html>
