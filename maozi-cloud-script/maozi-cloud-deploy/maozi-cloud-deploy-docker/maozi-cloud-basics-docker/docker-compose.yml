# ============================================================
# maozi-cloud-basics-docker —— 平台基础组件一键拉起
# ------------------------------------------------------------
# 本 Compose 启动平台运行所依赖的全部「基础组件」（不含业务服务）：
#   - 注册/配置中心：mysql + nacos
#   - 缓存：redis
#   - 可观测性栈（Observability Stack）：
#       * loki        日志聚合
#       * tempo       链路追踪后端
#       * prometheus  指标采集与存储
#       * grafana     指标/日志/追踪可视化
#       * promtail    日志采集 agent，采集共享日志目录后推送至 loki
# 注: maozi-cloud-gateway-service 已迁往 maozi-cloud-business-docker/
#     maozi-cloud-services-distributeds-docker.yml, 与 system / oauth 同层管理;
#     maozi-cloud-monitor-service / maozi-cloud-sentinel-service 属中间件服务
#     (maozi-cloud-services.json 里 is_middleware=true), 由 maozi-cloud-deploy-basics-all.sh
#     构建镜像并随本 compose 启动 (distributed / distributed-force 部署链路会跳过它们).
# ------------------------------------------------------------
# 启动前必须先创建外部网络：
#     docker network create maozi-cloud-network
# 多个 Compose 文件（basics / services / arthas / xxl-job / nexus）
# 都通过该网络互相通信。
# 宿主机日志挂载点（/Users/maozi/Desktop/maozi-cloud-logs）为开发者示例路径，
# 部署环境请按需替换为实际共享日志目录，且与 promtail 挂载保持一致。
# ============================================================
version: "3.7"
services:
  maozi-cloud-basic-nginx:
    # OpenResty: 提供 Lua balancer 能力, 后端域名运行时动态解析,
    # 本容器先于后端容器启动、后端重启换 IP 均可自动恢复
    image: openresty/openresty:1.27.1.1-alpine
    container_name: maozi-cloud-basic-nginx
    restart: always
    ports:
      - 80:80
    volumes:
      # 主配置: env 声明 / Docker DNS resolver / Lua 模块路径
      - ./maozi-cloud-basic-nginx/config/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      # server 配置骨架 (无 ${} 占位符, 不再依赖官方镜像的模板渲染机制)
      - ./maozi-cloud-basic-nginx/config/all.nginx.conf.template:/etc/nginx/conf.d/default.conf:ro
      # 各应用路由片段 (按应用一文件, 由 default.conf 内 server 级 include 引入)
      - ./maozi-cloud-basic-nginx/config/routes:/etc/nginx/conf.d/routes:ro
      # 动态 DNS 负载均衡 / 通用表单认证 Lua 模块 (dynamic_balancer / form_auth)
      - ./maozi-cloud-basic-nginx/config/lua:/etc/nginx/lua:ro
      # 自定义静态页 (通用登录页 login.html 等)
      - ./maozi-cloud-basic-nginx/config/html:/usr/local/openresty/nginx/html:ro

  # ============ 注册/配置中心：MySQL + Nacos ============
  maozi-cloud-basic-mysql:
    restart: always
    image: mysql:8.0.29
    container_name: maozi-cloud-basic-mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: "password"
    volumes:
      - ./maozi-cloud-basic-mysql/data/mysql/:/var/lib/mysql/
    ports:
      - 3306:3306
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppassword" ]
      interval: 5s       # 每 5 秒检查一次
      timeout: 3s        # 超时时间
      retries: 10        # 重试次数
      start_period: 10s  # 启动后等待多久开始检查

  # ============ 缓存：Redis ============
  maozi-cloud-basic-redis:
    restart: always
    image: redis:6.2.6
    container_name: maozi-cloud-basic-redis
    ports:
      - 6379:6379
    volumes:
      - ./maozi-cloud-basic-redis/config/redis.conf:/usr/local/etc/redis/redis.conf:rw
      - ./maozi-cloud-basic-redis/data/redis/data:/data:rw
    command:
      /bin/bash -c "redis-server /usr/local/etc/redis/redis.conf "

  # Grafana —— 可视化面板，统一查看 Loki 日志 / Tempo 追踪 / Prometheus 指标
  maozi-cloud-basic-grafana:
    restart: always
    image: grafana/grafana-oss:10.4.13
    container_name: maozi-cloud-basic-grafana
    environment:
      TZ: Asia/Shanghai
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # 允许被 iframe 内嵌（管理后台中间件管理页需要），否则响应头 X-Frame-Options: deny 拒绝嵌入
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      # 按子路径 /grafana 提供服务：配合管理后台同源代理内嵌打开（vite proxy / Nginx 转发）
      GF_SERVER_ROOT_URL: http://localhost:999/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    ports:
      - 3300:3000
    volumes:
      - ./maozi-cloud-basic-grafana/provisioning:/etc/grafana/provisioning:ro
      - ./maozi-cloud-basic-grafana/data:/var/lib/grafana:rw

  # Prometheus —— 指标采集与存储，抓取各服务 actuator/prometheus 端点
  maozi-cloud-basic-prometheus:
    restart: always
    image: prom/prometheus:v2.51.2
    container_name: maozi-cloud-basic-prometheus
    environment:
      TZ: Asia/Shanghai
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--enable-feature=exemplar-storage'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - 9090:9090
    volumes:
      - ./maozi-cloud-basic-prometheus/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./maozi-cloud-basic-prometheus/data:/prometheus:rw

  # Tempo —— 链路追踪后端，接收 OTLP 协议的 trace 数据
  maozi-cloud-basic-tempo:
    restart: always
    image: grafana/tempo:2.4.1
    container_name: maozi-cloud-basic-tempo
    environment:
      TZ: Asia/Shanghai
    command: -config.file=/etc/tempo-config.yml
    ports:
      - 3200:3200   # tempo HTTP UI
      - 4317:4317   # otlp grpc
      - 4318:4318   # otlp http
    volumes:
      - ./maozi-cloud-basic-tempo/config/tempo-config.yml:/etc/tempo-config.yml:ro
      - ./maozi-cloud-basic-tempo/data:/var/tempo:rw

  # ============ Observability Stack ============
  # Loki —— 日志聚合后端，接收 Promtail 推送的日志流
  maozi-cloud-basic-loki:
    restart: always
    image: grafana/loki:2.9.3
    container_name: maozi-cloud-basic-loki
    environment:
      TZ: Asia/Shanghai
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - 3100:3100
    volumes:
      - ./maozi-cloud-basic-loki/config/loki-config.yml:/etc/loki/loki-config.yml:ro
      - ./maozi-cloud-basic-loki/data:/loki:rw

  # Promtail —— 日志采集 agent，挂载共享日志目录后推送至 Loki
  maozi-cloud-basic-promtail:
    restart: always
    image: grafana/promtail:2.9.3
    container_name: maozi-cloud-basic-promtail
    environment:
      TZ: Asia/Shanghai
    command: -config.file=/etc/promtail/config.yml
    ports:
      - 9080:9080
    volumes:
      # 共享日志目录,Promtail 只读采集所有应用的日志文件
      - ${APPLICATION_LOG_PATH:-./maozi-cloud-basic-promtail/maozi-cloud-logs}:/maozi-logs:ro
      # Promtail 配置
      - ./maozi-cloud-basic-promtail/config/promtail-config.yml:/etc/promtail/config.yml:ro
      # positions (采集位置) 持久化,容器重启可续读
      - ./maozi-cloud-basic-promtail/data:/data:rw

  maozi-cloud-basic-nacos:
    restart: always
    image: nacos/nacos-server:v2.4.2-slim
    container_name: maozi-cloud-basic-nacos
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: maozi-cloud-basic-mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: maozi-cloud-nacos-middleware-db
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: password
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&serverTimezone=Asia/Shanghai
    ports:
      - 8848:8848
      - 9848:9848
      - 9555:9555
    healthcheck:
      # $$ 双转义: 端口取容器运行时环境变量 APPLICATION_PORT, 随各服务端口配置自动生效
      # liveness(存活) 与 readiness(就绪) 探针均返回 200 才视为健康
      test: [ "CMD-SHELL", "curl -sf http://localhost:8848/nacos/actuator/health/liveness && curl -sf http://localhost:8848/nacos/actuator/health/readiness" ]
      interval: 5s      # 每 30 秒检查一次
      timeout: 5s        # 单次检查超时时间
      retries: 3         # 连续失败 5 次后标记 unhealthy
      start_period: 20s # 启动宽限期(Java 服务启动较慢), 宽限期内失败不计入重试
    depends_on:
      maozi-cloud-basic-mysql:
        condition: service_healthy

  maozi-cloud-basic-seata:
    restart: always
    image: seataio/seata-server:2.0.0
    container_name: maozi-cloud-basic-seata
    ports:
      - "7091:7091"
      - "8091:8091"
    environment:
      SEATA_IP: ${APPLICATION_TO_REGISTER_IP}
      SEATA_PORT: 8091
      STORE_MODE: db
    volumes:
      - /usr/share/zoneinfo/Asia/Shanghai:/etc/localtime
      - /usr/share/zoneinfo/Asia/Shanghai:/etc/timezone
      - ./maozi-cloud-basic-seata/config/application.yml:/seata-server/resources/application.yml
    depends_on:
      maozi-cloud-basic-nacos:
        condition: service_healthy

  maozi-cloud-basic-xxljob:
    restart: always
    image: xuxueli/xxl-job-admin:3.4.2
    container_name: maozi-cloud-basic-xxljob
    environment:
      # context-path=/xxljob: 控制台挂子路径, nginx /xxljob 原样透传 (前端模板
      # 全按 ${request.contextPath} 渲染); 执行器注册地址同步带后缀 (nacos: boot-xxljob.yml)
      PARAMS: "--spring.datasource.url=jdbc:mysql://maozi-cloud-basic-mysql:3306/maozi-cloud-xxljob-middleware-db?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai --spring.datasource.username=root --spring.datasource.password=password --server.servlet.context-path=/xxljob"
      TZ: Asia/Shanghai
    volumes:
      - ./maozi-cloud-basic-xxljob/data:/data/applogs
    ports:
      - 12000:8080
    depends_on:
      maozi-cloud-basic-mysql:
        condition: service_healthy

  # SnailJob —— 分布式任务重试与调度平台
  # 部署文档: https://snailjob.opensnail.com/docs/guide/server/service_deployment.html
  # Web 控制台: http://localhost:8800/snail-job (默认账号 admin/admin)
  maozi-cloud-basic-snailjob:
    restart: always
    image: opensnail/snail-job:1.10.0
    container_name: maozi-cloud-basic-snailjob
    environment:
      TZ: Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_DATASOURCE_URL: jdbc:mysql://maozi-cloud-basic-mysql:3306/maozi-cloud-snailjob-middleware-db?useSSL=false&characterEncoding=utf8&useUnicode=true&serverTimezone=Asia/Shanghai
      # 屏蔽 Fory 序列化框架（SnailJob 底层依赖）的任务分发冗余日志：类注册告警/实例创建/序列化代码生成/白名单提示
      # relaxed binding: LOGGING_LEVEL_ORG_APACHE_FORY -> logging.level.org.apache.fory
      LOGGING_LEVEL_ORG_APACHE_FORY: ERROR
    ports:
      - 8800:8080     # Web 控制台
      - 17888:17888   # Netty 通信端口, 客户端(执行器)需能访问
    depends_on:
      maozi-cloud-basic-mysql:
        condition: service_healthy

  # ============ Java 中间件服务 (is_middleware=true) ============
  # 由 maozi-cloud-deploy-basics-all.sh 判断 maozi-cloud-*-service:latest 镜像是否存在,
  # 不存在则 mvn -pl <module> -amd 构建 jar 并渲染 Dockerfile 构建镜像 (不在此启动),
  # 最后统一由本 compose 拉起
  maozi-cloud-basic-monitor:
    image: maozi-cloud-basic-monitor:latest
    container_name: maozi-cloud-basic-monitor
    restart: always
    ports:
      - 2000:2000
    environment:
      JVM_PARAMS: ${APPLICATION_JVM_PARAMS}
      APPLICATION_PORT: 2000
      APPLICATION_ENVIRONMENT: prod
    depends_on:
      maozi-cloud-basic-nacos:
        condition: service_healthy

  # Sentinel —— 流控规则控制台 (Dashboard), 规则持久化到 mysql / nacos
  maozi-cloud-basic-sentinel:
    image: maozi-cloud-basic-sentinel:latest
    container_name: maozi-cloud-basic-sentinel
    restart: always
    ports:
      - 8858:8858
    environment:
      JVM_PARAMS: ${APPLICATION_JVM_PARAMS}
      AUTH_USERNAME: sentinel
      AUTH_PASSWORD: sentinel
      MYSQL_HOST: maozi-cloud-basic-mysql
      MYSQL_PORT: 3306
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: maozi-cloud-sentinel-middleware-db
      NACOS_SERVER: maozi-cloud-basic-nacos:8848
      NACOS_NAMESPACE: middleware
      NACOS_GROUP: SENTINEL_GROUP
      METRICE_RETENTION_DAYS: 30
      METRIC_AGGREGATE_SECONDS: 10
    depends_on:
      maozi-cloud-basic-mysql:
        condition: service_healthy
      maozi-cloud-basic-nacos:
        condition: service_healthy

  # Arthas Tunnel Server —— 在线诊断中心: 聚合各业务进程的 Arthas 会话,
  # 通过 Web UI 远程连接业务容器诊断 (watch/trace/jad 等);
  # 业务镜像由 -Darthas.tunnelServer 指向 ws://maozi-cloud-basic-arthas:7777/ws
  maozi-cloud-basic-arthas:
    restart: always
    image: supernpc/arthas-tunnel-server:4.3.4
    container_name: maozi-cloud-basic-arthas
    ports:
      - 9100:8080   # Web 管理页 (HTTP)
      - 7777:7777   # Arthas Agent 注册通道
    command: "--arthas.enable-detail-pages=true"
    depends_on:
      maozi-cloud-basic-nacos:
        condition: service_healthy

# 外部网络：所有 Compose 通过该网络互通，启动前需先手动创建
networks:
  default:
    external:
      name: maozi-cloud-network