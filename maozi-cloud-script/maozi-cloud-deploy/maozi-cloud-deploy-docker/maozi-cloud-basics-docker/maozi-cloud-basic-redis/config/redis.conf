# ============================================================
# Redis 自定义配置 —— 配合 maozi-cloud-basics-docker 使用
# ------------------------------------------------------------
# 在官方默认配置基础上做了如下自定义：
#   - protected-mode no    关闭保护模式，允许容器网络外部访问（部署环境需配合防火墙/密码）
#   - appendonly yes       开启 AOF 持久化
#   - appendfsync everysec 每秒刷盘，性能与可靠性的折中
#   - requirepass          设置访问密码
# ------------------------------------------------------------
# !! 部署前必改 !!
#   requirepass 当前为示例弱密码（812840531zhang），生产请改为强密码，
#   并与 boot-redis.yml 中的 password、xxl-job/arthas 等模块的 password 保持一致。
# ============================================================

# 关闭保护模式（容器对外暴露，依赖密码鉴权）
protected-mode no
# 监听端口
port 6379
# 客户端空闲超时（0 = 永不超时）
timeout 0

# RDB 快照策略：900s 内 1 次写入 / 300s 内 10 次 / 60s 内 10000 次
save 900 1
save 300 10
save 60 10000
# 启用 RDB 文件压缩
rdbcompression yes
# RDB 文件名
dbfilename dump.rdb
# 工作目录（容器内 /data，由 docker-compose 挂载到宿主机 ./data/redis/data）
dir /data

# 启用 AOF 追加持久化
appendonly yes
# AOF 刷盘策略：每秒一次，宕机最多丢失 1 秒数据
appendfsync everysec

# !! 部署前必改：示例密码，生产环境请替换 !!
requirepass password