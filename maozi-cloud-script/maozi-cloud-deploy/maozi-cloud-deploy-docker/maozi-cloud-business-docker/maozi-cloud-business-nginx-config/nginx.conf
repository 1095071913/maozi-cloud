# ============================================================
# OpenResty 主配置 (替换镜像内置 nginx.conf, 由 compose 挂载)
# ------------------------------------------------------------
# 与官方 nginx 镜像的差异:
#   1. OpenResty 镜像没有 /etc/nginx/templates 模板渲染机制,
#      故 ${ENVIRONMENT}/${VERSION} 不再做 envsubst 占位,
#      改由 conf.d 中 Lua 通过 os.getenv() 运行时读取;
#   2. 后端域名一律不在配置加载期解析 (原静态 upstream/proxy_pass
#      在加载期一次性解析并永久缓存, 后端容器后启动或重启换 IP
#      会永久 502/503):
#        - $变量形式的 proxy_pass -> 按下方 resolver 运行时解析;
#        - upstream 双节点容灾    -> balancer_by_lua 动态解析
#          (见 lua/dynamic_balancer.lua)。
# ============================================================
worker_processes  auto;

error_log  /dev/stderr notice;

events {
    worker_connections  1024;
}

# nginx 默认会清空 worker 进程继承的环境变量, 此处显式声明给 Lua os.getenv() 使用
env ENVIRONMENT;
env VERSION;

http {
    include       /usr/local/openresty/nginx/conf/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;

    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   2;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript
                      text/xml application/xml application/xml+rss text/javascript;

    # 自定义 Lua 模块目录 (dynamic_balancer.lua)
    lua_package_path "/etc/nginx/lua/?.lua;/usr/local/openresty/lualib/?.lua;;";

    # 节点失败冷却的跨 worker 共享存储 (等价 max_fails=1 fail_timeout 的状态,
    # 共享后整个实例一个冷却窗口内只探测坏节点一次, 而非每个 worker 各一次)
    lua_shared_dict dyn_balancer_fail 1m;

    # Docker 内嵌 DNS: 供 $变量形式的 proxy_pass 在请求期解析 (admin 前端 / nacos / grafana / snail-job)
    # valid 为解析缓存秒数, 后端容器重启换 IP 后最长 valid 秒内自动恢复
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    log_format  upstream_log  '$remote_addr - $remote_user [$time_local] "$request" '
                              '$status $body_bytes_sent "$http_referer" '
                              '"$http_user_agent" "$http_x_forwarded_for" $upstream_addr';

    access_log  /dev/stdout  upstream_log;

    include /etc/nginx/conf.d/*.conf;
}
