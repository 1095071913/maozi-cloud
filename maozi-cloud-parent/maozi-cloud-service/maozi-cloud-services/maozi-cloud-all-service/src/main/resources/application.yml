# ============================================================
# maozi-cloud-all-service 启动引导配置（单体部署入口）
# 本文件为单体全量服务的 application 配置，通过 spring.config.import
# 聚合各组件子配置文件，并定义项目元信息与端口。
# ============================================================

spring:
  config:
    # 导入各组件子配置文件（classpath 下的 config/ 目录）
    import:
      - classpath:config/${application.environment:local}/application.yml
      - classpath:config/${application.environment:local}/boot-default.yml       # 通用默认配置（服务器、Jackson、日志级别等）
      - classpath:config/${application.environment:local}/boot-db.yml             # 数据库配置（MyBatis-Plus、Flyway）
      - classpath:config/${application.environment:local}/boot-redis.yml          # Redis 缓存配置
      - classpath:config/${application.environment:local}/boot-lock.yml           # 分布式锁（Redisson）配置
      - classpath:config/${application.environment:local}/cloud-oauth.yml         # OAuth2 资源服务器配置
      - classpath:config/${application.environment:local}/boot-monitor.yml

# 项目展示信息（用于 Swagger 文档、日志等）
application:
  port: 1100
  title: 单体全量业务服务
  details: 所有服务功能

# 接口白名单（不需要认证的路径，注释掉则全部接口需认证）
application-project-whitelist: /config/system/get

# 项目系统信息（用于文档展示与版权声明）
application-project-system:
  projectName: 小猫子脚手架
  corporationName: 小猫子网络科技有限公司
  icon: http://dummyimage.com/100x100
  environment: ${application.environment}
  description: 基于 Spring Cloud Alibaba + Dubbo 的一站式分布式解决方案开源封装，内置分布式应用开发所需全套组件，统一团队代码风格，保障代码质量，让开发者专注业务逻辑，实现高效快速开发。
  copyright: 本网站所有权归《${application-project-system.corporationName}》所有，请勿抄袭和抄袭