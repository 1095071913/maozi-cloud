appId: com.maozi.cloud.developadmin
productName: maozi-cloud-develop-admin
copyright: Copyright © 2026 maozi

# 构建资源（图标）目录与产物输出目录
directories:
  buildResources: build
  output: release

# 打包进应用的文件（其余如 electron/、src/ 源码不会被打包）
files:
  - dist/**
  - dist-electron/**

# ============ macOS ============
mac:
  category: public.app-category.developer-tools
  # Finder/启动台中显示的中文名（写入 Info.plist）
  extendInfo:
    CFBundleDisplayName: 个人开发管理
  icon: build/icon.icns
  # 同时构建 Apple Silicon 与 Intel 架构；dmg 用于分发，zip 备用
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  # 没有付费 Apple 开发者证书时设为 null，跳过签名（首次打开需右键->打开）
  identity: null

dmg:
  title: ${productName} ${version}
  artifactName: ${productName}-${version}-${arch}.dmg

# ============ Windows（为后续扩展预留） ============
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: ${productName}-${version}-setup-${arch}.exe

# electron-builder 下载 Electron 等依赖失败时，可取消注释使用国内镜像
# electronDownload:
#   mirror: https://npmmirror.com/mirrors/electron/
