spring:
  # MySQL 生产环境 2C4G 配置
  datasource:
    # 连接池实现：HikariCP（Spring Boot 默认连接池）
    type: com.zaxxer.hikari.HikariDataSource
    # 未配置 driver-class-name：由 Spring Boot 按 url 自动推断为 com.mysql.cj.jdbc.Driver
    # JDBC 连接串：主机端口取 ${APPLICATION_MYSQL_SERVER}，库名取 ${APPLICATION_MYSQL_SERVER_DB}
    # 未覆盖时默认容器内基础 MySQL 服务 / 「应用名-环境-db」（每个服务独立库）
    # 连接参数：
    #   useSSL=false                内网直连关闭 SSL，避免自签证书告警
    #   serverTimezone=Asia/Shanghai 指定时区，不配可能报时区无法识别或时间偏差8小时
    #   characterEncoding=utf8      字符编码（Connector/J 8 实际按 utf8mb4 建连）
    #   nullCatalogMeansCurrent=true 元数据查询限定当前库（MySQL 8 驱动默认会扫出所有库）
    url: jdbc:mysql://${APPLICATION_MYSQL_SERVER:maozi-cloud-basic-mysql:3306}/${APPLICATION_MYSQL_SERVER_DB:${spring.application.name}-${application.environment}-db}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&nullCatalogMeansCurrent=true
    # 账号密码：支持环境变量覆盖，默认 root / password（生产必须覆盖）
    username: ${APPLICATION_MYSQL_SERVER_USERNAME:root}
    password: ${APPLICATION_MYSQL_SERVER_PASSWORD:password}
    # Hikari 连接池参数
    hikari:
      # 连接池名称：日志/JMX/Micrometer 指标（hikaricp_*）均携带，多服务共用监控时区分应用
      pool-name: ${spring.application.name}-HikariPool
      # 最大连接数：2C4G 单 Pod 经验值 10~20（瓶颈在 DB 而非连接数），压测后精调
      maximum-pool-size: 15
      # 最小空闲连接：与最大连接相等，显式声明固定大小池（官方推荐，避免流量波动时频繁建连）
      minimum-idle: 15
      # 获取连接超时（3s）：池耗尽时快速失败，交由上游熔断/重试，避免拖垮 Tomcat 线程池
      connection-timeout: 3000
      # isValid 校验超时（2s）：官方要求小于 connection-timeout，默认 5000 大于上面的 3000，故显式声明
      validation-timeout: 2000
      # 连接最大存活（540s=9min）：须比 MySQL wait_timeout 小 60s 以上，到期滚动重建（自带至多 2.5% 负向随机抖动）
      max-lifetime: 540000
      # 空闲保活（30s，最小允许值，须小于 max-lifetime）：防 K8s NAT/LB 静默断连，配合下方 tcpKeepAlive
      keepalive-time: 30000
      # 连接泄漏检测（60s）：借出超 60s 未归还打印借用堆栈告警（仅告警不报错，合法长事务也会触发）
      leak-detection-threshold: 60000
      # 不配置 idle-timeout：min=max 固定池下该项不生效（仅 min<max 时生效）
      # 不配置 connection-test-query：使用 JDBC4 isValid 校验，性能优于 SQL 探测
      # 不配置 initialization-fail-timeout：默认 1ms（启动即校验），DB 不可用时启动失败，由 K8s 重启恢复
      #
      # ---------- 驱动层调优（Connector/J 8 属性，属性名大小写不敏感） ----------
      data-source-properties:
        # 服务端预编译 + 客户端语句缓存（每连接 250 条、SQL 长度上限 2048）：复用 prepare 结果，省去重复 parse/prepare 往返
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        # 会话状态本地化：autocommit/隔离级别未变时不再发 SET（仅直连 MySQL 适用，经代理需去掉）
        useLocalSessionState: true
        elideSetAutoCommits: true
        # 缓存 server 配置与 ResultSet 元数据，减少元数据类往返
        cacheServerConfiguration: true
        cacheResultSetMetadata: true
        # 不维护驱动内部时间统计，每次查询省去至少两次取系统时间调用（HikariCP wiki 推荐项）
        maintainTimeStats: false
        # 批量改写：多条 INSERT 合并为多值语句提升批量吞吐（updateCounts/getGeneratedKeys 语义有变，需自测）
        rewriteBatchedStatements: true
        # TCP 建连超时（2s）：驱动默认 0（不限时），网络故障时必须快速失败
        connectTimeout: 2000
        # 网络读超时（60s）：须大于线上最慢 SQL，避免网络分区/DB 挂起时线程无限阻塞
        socketTimeout: 60000
        # OS 层 TCP keepalive，与 hikari keepalive-time 双保险对抗容器网络静默断连
        tcpKeepAlive: true
  # Flyway 数据库版本迁移配置（启动时按版本号执行脚本）
  flyway:
    enabled: true                                            # 启用 Flyway
    table: system_table_flyway                               # 迁移历史记录表名
    clean-disabled: true                                     # 禁用 clean 命令（防止误删数据）
    out-of-order: true                                       # 允许乱序迁移
    baseline-on-migrate: true                                # 已有库首次迁移时自动打基线
    baseline-version: 0                                      # 基线版本号
    locations: classpath:db                                  # 迁移脚本目录
    encoding: UTF-8                                          # 脚本编码

# MyBatis-Plus 增强版 ORM 配置
mybatis-plus:
  mapper-locations: classpath:com/maozi/*/*/mapper/*.xml   # Mapper XML 扫描路径
  # typeEnumsPackage: com.maozi.${application-project-abbreviation}.*.enums  # 旧属性（MP 3.x 已废弃，由 default-enum-type-handler 接管）
  configuration:
    map-underscore-to-camel-case: true                     # 下划线转驼峰
    log-impl: com.maozi.db.config.MybatisPlusLog           # 自定义日志实现（收集 SQL 与参数，随请求日志统一输出）
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler  # 默认枚举类型处理器（覆盖默认 EnumTypeHandler）
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 控制台输出 SQL（调试用）
  global-config:
    refresh: false                                          # MP 2.x 旧属性（3.5.x 已移除，当前不生效）
    banner: false                                           # 关闭 MyBatis-Plus Banner
    db-config:
      db-type: mysql                                        # 旧属性（MP 3.x 已移除，当前不生效）
      id-type: AUTO                                         # 主键策略：数据库自增
      field-strategy: NOT_NULL                              # 旧属性（3.x 已拆分为 insert/update/select-strategy，当前不生效）
      column-like: false                                    # 旧属性（MP 3.x 已移除，当前不生效）
      capital-mode: true                                    # 开启大写命名（列名驼峰转下划线后再转大写）
      logic-delete-value: 1                                 # 逻辑已删除值
      logic-not-delete-value: 0                             # 逻辑未删除值

# MyBatis-Plus-Join 多表连接查询插件配置
mybatis-plus-join:
  banner: false                                              # 关闭 Banner
  table-alias: main                                          # MPJ 主表别名（默认 t），项目同时用作排序字段前缀

# 原生 MyBatis 配置（classpath 无 mybatis-spring-boot-starter，mybatis.* 前缀当前不被读取）
mybatis:
  configuration:
    cache-enabled: false                                     # 关闭二级缓存（业务层由 Redis 缓存替代）