# ============================================================
# 分布式锁配置（基于 Redisson，复用 boot-redis.yml 的 Redis 连接参数）
# ============================================================
lock:
  redisson:
    address: redis://${spring.data.redis.host}:${spring.data.redis.port}  # 单节点地址（复用 Redis 主机与端口）
    password: ${spring.data.redis.password}                               # 连接密码（复用 Redis 密码）
    database: ${spring.data.redis.database:0}                             # 逻辑库编号（复用 Redis 库，默认 0），仅单节点模式生效
    # waitTime: 60 # 获取锁最长等待时间（默认 60，单位：秒）
    # leaseTime: 60 # 持有锁后自动释放时间（默认 60，单位：秒）
    # 集群模式：配置 lock.redisson.node-addresses 后优先生效，与 address 二选一
    # 如 redis://127.0.0.1:7000,redis://127.0.0.1:7001,redis://127.0.0.1:7002
    # node-addresses: