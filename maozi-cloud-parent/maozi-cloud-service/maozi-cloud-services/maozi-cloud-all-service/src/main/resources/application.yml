# ============================================================
# maozi-cloud-all-service 启动引导配置（单体部署入口）
# 本文件为单体全量服务的 application 配置，通过 spring.config.import
# 聚合各组件子配置文件，并定义项目元信息与端口。
# ============================================================

# 项目展示信息（用于 Swagger 文档、日志等）
application:
  port: 1000
  title: 单体全量业务服务
  details: 所有服务功能

# 数据库名称覆盖（注释掉则使用默认规则：${应用名}-${环境}-db）
#application-datasource-db-name: maozi-cloud-all-service-local-db

# 接口白名单（不需要认证的路径，注释掉则全部接口需认证）
application-project-whitelist: /config/system/get

# 项目系统信息（用于文档展示与版权声明）
application-project-system:
  projectName: 小猫子脚手架
  corporationName: 小猫子网络科技有限公司
  icon: http://dummyimage.com/100x100
  environment: ${application.environment}
  description: 基于 Spring Cloud Alibaba + Dubbo 的一站式分布式解决方案开源封装，内置分布式应用开发所需全套组件，统一团队代码风格，保障代码质量，让开发者专注业务逻辑，实现高效快速开发。
  copyright: 本网站所有权归《${application-project-system.corporationName}》所有，请勿抄袭和抄袭

# 图片存储配置（store-type 决定上传路由到的存储处理器，取值见 ImageStorageType 枚举 code）
oss:
  # 路由到阿里云处理器
  store-type: aliyun
  aliyun:
    access-key-id: ${ALIYUN_CLIENT_ID}
    access-key-secret: ${ALIYUN_CLIENT_SECRET}
    region: cn-beijing
    endpoint: https://oss-cn-beijing.aliyuncs.com
    bucket: maozi-cloud-bucket
    #domain:                  # 可选，CDN 自定义域名

spring:
  # 上传文件大小限制（图片上传接口，单文件 10MB、单次请求合计 50MB）
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 5MB
  config:
    # 导入各组件子配置文件（classpath 下的 config/ 目录）
    import:
      - classpath:config/boot-default.yml       # 通用默认配置（服务器、Jackson、日志级别等）
      - classpath:config/boot-datasource.yml     # 数据源配置（Hikari 连接池）
      - classpath:config/boot-db.yml             # 数据库配置（MyBatis-Plus、Flyway）
      - classpath:config/boot-redis.yml          # Redis 缓存配置
      - classpath:config/boot-lock.yml           # 分布式锁（Redisson）配置
      - classpath:config/cloud-oauth.yml         # OAuth2 资源服务器配置
      - classpath:config/boot-monitor.yml
  ai:
    # zhipuai:
    #   base-url: https://api.z.ai/api/paas
    #   api-key:
    #   chat:
    #     options:
    #       model: glm-5.2
    #   embedding:
    #     enabled: false
    dashscope:
      api-key: ${AI_DASHSCOPE_KEY}
      chat:
        enabled: true
        options:
          model: qwen-max
          text_image_model: qwen-vl-max
      embedding:
        enabled: false
        options:
          model: text-embedding-v3
          dimensions: 1024
    # openai:
    #   base-url:
    #   api-key:
    #   chat:
    #     options:
    #       model: gpt
    #   embedding:
    #     enabled: false