# ============================================================
# maozi-cloud-services-distributeds-docker.yml —— 业务服务一键拉起
# ------------------------------------------------------------
# 本 Compose 启动 maozi-cloud 平台的「业务服务」层（区别于 basics 的基础组件层）：
#   - maozi-cloud-system-service   系统管理服务（端口 4000 / Dubbo 20881）
#   - maozi-cloud-oauth-service    OAuth 鉴权服务（端口 3000 / Dubbo 20880）
#   - maozi-cloud-gateway-service  业务网关（端口 1000）
#   - maozi-cloud-monitor-service  Spring Boot Admin 监控（端口 2000）
# ------------------------------------------------------------
# 启动前置：
#   1. 先启动 maozi-cloud-basics-docker（提供 mysql / nacos / redis 等）；
#   2. 外部网络 maozi-cloud-network 必须已创建；
#   3. 业务镜像需通过 maozi-cloud-deploy-run 流程构建并 tag 为 laster（注：当前 compose
#      中所有 image tag 统一使用 "laster"，疑为 "latest" 的拼写错误，但需与构建脚本
#      输出保持一致；如需改为 latest，需同步修改本文件和构建脚本）。
# ------------------------------------------------------------
# 关于 environment.ENVIRONMENT：
#   environment 块下传入两个环境变量：
#     - ENVIRONMENT=dev          标识当前运行环境，供 bootstrap.yml 决定加载哪套
#                                Nacos 配置（local / dev / test / prod 等）；
#     - NACOS_CONFIG_SERVER=...  指定 Nacos 配置中心地址，避免容器内写死。
# 宿主机日志挂载点（/Users/maozi/Desktop/maozi-cloud-logs）为开发者示例路径，
# 部署环境请按需替换，且需与 promtail 挂载保持一致以纳入日志采集。
# ============================================================
version: "3.7"
services:

  # ============ Gateway 业务网关 ============
  maozi-cloud-gateway-service:
    image: maozi-cloud-gateway-service:laster
    container_name: maozi-cloud-gateway-service
    restart: always
    ports:
      - 1100:1100
    environment:
      APPLICATION_VERSION: ${APPLICATION_VERSION}
      APPLICATION_ENVIRONMENT: ${APPLICATION_ENVIRONMENT}
    volumes:
      # 日志文件挂载到宿主机共享目录,供 promtail 采集
      - ${APPLICATION_LOG_PATH:-./../maozi-cloud-basics-docker/maozi-cloud-basic-promtail/maozi-cloud-logs}/${APPLICATION_ENVIRONMENT:-dev}/${APPLICATION_VERSION:-main}/maozi-cloud-gateway-service:/application/maozi-cloud-gateway-service/logs

  # ============ Monitor 监控服务 (Spring Boot Admin) ============
  maozi-cloud-monitor-service:
    image: maozi-cloud-monitor-service:laster
    container_name: maozi-cloud-monitor-service
    restart: always
    ports:
      - 2000:2000
    environment:
      APPLICATION_VERSION: ${APPLICATION_VERSION}
      APPLICATION_ENVIRONMENT: ${APPLICATION_ENVIRONMENT}
    volumes:
      # 日志文件挂载到宿主机共享目录,供 promtail 采集
      - ${APPLICATION_LOG_PATH:-./../maozi-cloud-basics-docker/maozi-cloud-basic-promtail/maozi-cloud-logs}/${APPLICATION_ENVIRONMENT:-dev}/${APPLICATION_VERSION:-main}/maozi-cloud-monitor-service:/application/maozi-cloud-monitor-service/logs

  # ============ OAuth 业务服务 ============
  maozi-cloud-oauth-service:
    image: maozi-cloud-oauth-service:laster
    container_name: maozi-cloud-oauth-service
    restart: always
    ports:
      - 3000:3000
      - 21881:21881
    environment:
      APPLICATION_VERSION: ${APPLICATION_VERSION}
      APPLICATION_ENVIRONMENT: ${APPLICATION_ENVIRONMENT}
    volumes:
      # 日志文件挂载到宿主机共享目录,供 promtail 采集
      - ${APPLICATION_LOG_PATH:-./../maozi-cloud-basics-docker/maozi-cloud-basic-promtail/maozi-cloud-logs}/${APPLICATION_ENVIRONMENT:-dev}/${APPLICATION_VERSION:-main}/maozi-cloud-oauth-service:/application/maozi-cloud-oauth-service/logs

  # ============ System 业务服务 ============
  maozi-cloud-system-service:
    image: maozi-cloud-system-service:laster
    container_name: maozi-cloud-system-service
    restart: always
    ports:
      - 4000:4000
      - 21880:21880
    environment:
      APPLICATION_VERSION: ${APPLICATION_VERSION}
      APPLICATION_ENVIRONMENT: ${APPLICATION_ENVIRONMENT}
    volumes:
      # 日志文件挂载到宿主机共享目录,供 promtail 采集
      - ${APPLICATION_LOG_PATH:-./../maozi-cloud-basics-docker/maozi-cloud-basic-promtail/maozi-cloud-logs}/${APPLICATION_ENVIRONMENT:-dev}/${APPLICATION_VERSION:-main}/maozi-cloud-system-service:/application/maozi-cloud-system-service/logs

  # ============ AI 业务服务 ============
  maozi-cloud-ai-service:
    image: maozi-cloud-ai-service:laster
    container_name: maozi-cloud-ai-service
    restart: always
    ports:
      - 6000:6000
      - 21882:21882
    environment:
      APPLICATION_VERSION: ${APPLICATION_VERSION}
      APPLICATION_ENVIRONMENT: ${APPLICATION_ENVIRONMENT}
    volumes:
      # 日志文件挂载到宿主机共享目录,供 promtail 采集
      - ${APPLICATION_LOG_PATH:-./../maozi-cloud-basics-docker/maozi-cloud-basic-promtail/maozi-cloud-logs}/${APPLICATION_ENVIRONMENT:-dev}/${APPLICATION_VERSION:-main}/maozi-cloud-ai-service:/application/maozi-cloud-ai-service/logs


# 外部网络：与 maozi-cloud-basics-docker 共享同一网络
networks:
  default:
    external:
      name: maozi-cloud-network