# ============================================================
# maozi-cloud-basics-docker —— 平台基础组件一键拉起
# ------------------------------------------------------------
# 本 Compose 启动平台运行所依赖的全部「基础组件」（不含业务服务）：
#   - 注册/配置中心：mysql + nacos
#   - 缓存：redis
#   - 可观测性栈（Observability Stack）：
#       * loki        日志聚合
#       * tempo       链路追踪后端
#       * prometheus  指标采集与存储
#       * grafana     指标/日志/追踪可视化
#       * promtail    日志采集 agent，采集共享日志目录后推送至 loki
# 注: maozi-cloud-gateway-service / maozi-cloud-monitor-service 已迁往
#     maozi-cloud-distributeds-docker/maozi-cloud-services-distributeds-docker.yml, 与 system / oauth 同层管理.
# ------------------------------------------------------------
# 启动前必须先创建外部网络：
#     docker network create maozi-cloud-network
# 多个 Compose 文件（basics / services / arthas / xxl-job / nexus）
# 都通过该网络互相通信。
# 宿主机日志挂载点（/Users/maozi/Desktop/maozi-cloud-logs）为开发者示例路径，
# 部署环境请按需替换为实际共享日志目录，且与 promtail 挂载保持一致。
# ============================================================
version: "3.7"
services:

  # ============ 注册/配置中心：MySQL + Nacos ============
  maozi-cloud-basic-mysql:
    restart: always
    image: mysql:8.0.29
    container_name: maozi-cloud-basic-mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: "password"
    volumes:
      - ./maozi-cloud-basic-mysql/data/mysql/:/var/lib/mysql/
    ports:
      - 3306:3306
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppassword" ]
      interval: 5s       # 每 5 秒检查一次
      timeout: 3s        # 超时时间
      retries: 10        # 重试次数
      start_period: 10s  # 启动后等待多久开始检查

  # ============ 缓存：Redis ============
  maozi-cloud-basic-redis:
    restart: always
    image: redis:6.2.6
    container_name: maozi-cloud-basic-redis
    ports:
      - 6379:6379
    volumes:
      - ./maozi-cloud-basic-redis/config/redis.conf:/usr/local/etc/redis/redis.conf:rw
      - ./maozi-cloud-basic-redis/data/redis/data:/data:rw
    command:
      /bin/bash -c "redis-server /usr/local/etc/redis/redis.conf "

  # Grafana —— 可视化面板，统一查看 Loki 日志 / Tempo 追踪 / Prometheus 指标
  maozi-cloud-basic-grafana:
    restart: always
    image: grafana/grafana-oss:10.4.13
    container_name: maozi-cloud-basic-grafana
    environment:
      TZ: Asia/Shanghai
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # 允许被 iframe 内嵌（管理后台中间件管理页需要），否则响应头 X-Frame-Options: deny 拒绝嵌入
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      # 按子路径 /grafana 提供服务：配合管理后台同源代理内嵌打开（vite proxy / Nginx 转发）
      GF_SERVER_ROOT_URL: http://localhost:999/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    ports:
      - 3300:3000
    volumes:
      - ./maozi-cloud-basic-grafana/provisioning:/etc/grafana/provisioning:ro
      - ./maozi-cloud-basic-grafana/data:/var/lib/grafana:rw

  # Prometheus —— 指标采集与存储，抓取各服务 actuator/prometheus 端点
  maozi-cloud-basic-prometheus:
    restart: always
    image: prom/prometheus:v2.51.2
    container_name: maozi-cloud-basic-prometheus
    environment:
      TZ: Asia/Shanghai
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--enable-feature=exemplar-storage'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - 9090:9090
    volumes:
      - ./maozi-cloud-basic-prometheus/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./maozi-cloud-basic-prometheus/data:/prometheus:rw

  # Tempo —— 链路追踪后端，接收 OTLP 协议的 trace 数据
  maozi-cloud-basic-tempo:
    restart: always
    image: grafana/tempo:2.4.1
    container_name: maozi-cloud-basic-tempo
    environment:
      TZ: Asia/Shanghai
    command: -config.file=/etc/tempo-config.yml
    ports:
      - 3200:3200   # tempo HTTP UI
      - 4317:4317   # otlp grpc
      - 4318:4318   # otlp http
    volumes:
      - ./maozi-cloud-basic-tempo/config/tempo-config.yml:/etc/tempo-config.yml:ro
      - ./maozi-cloud-basic-tempo/data:/var/tempo:rw

  # ============ Observability Stack ============
  # Loki —— 日志聚合后端，接收 Promtail 推送的日志流
  maozi-cloud-basic-loki:
    restart: always
    image: grafana/loki:2.9.3
    container_name: maozi-cloud-basic-loki
    environment:
      TZ: Asia/Shanghai
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - 3100:3100
    volumes:
      - ./maozi-cloud-basic-loki/config/loki-config.yml:/etc/loki/loki-config.yml:ro
      - ./maozi-cloud-basic-loki/data:/loki:rw

  # Promtail —— 日志采集 agent，挂载共享日志目录后推送至 Loki
  maozi-cloud-basic-promtail:
    restart: always
    image: grafana/promtail:2.9.3
    container_name: maozi-cloud-basic-promtail
    environment:
      TZ: Asia/Shanghai
    command: -config.file=/etc/promtail/config.yml
    ports:
      - 9080:9080
    volumes:
      # 共享日志目录,Promtail 只读采集所有应用的日志文件
      - ${APPLICATION_LOG_PATH:-./maozi-cloud-basic-promtail/maozi-cloud-logs}:/maozi-logs:ro
      # Promtail 配置
      - ./maozi-cloud-basic-promtail/config/promtail-config.yml:/etc/promtail/config.yml:ro
      # positions (采集位置) 持久化,容器重启可续读
      - ./maozi-cloud-basic-promtail/data:/data:rw

  maozi-cloud-basic-nacos:
    restart: always
    image: nacos/nacos-server:2.0.4-slim
    container_name: maozi-cloud-basic-nacos
    env_file:
      - maozi-cloud-basic-nacos/env/nacos-mysql.env
    ports:
      - 8848:8848
      - 9848:9848
      - 9555:9555
    depends_on:
      maozi-cloud-basic-mysql:
        condition: service_healthy

  maozi-cloud-basic-seata:
    restart: always
    image: seataio/seata-server:2.0.0
    container_name: maozi-cloud-basic-seata
    ports:
      - "7091:7091"
      - "8091:8091"
    environment:
      SEATA_IP: ${NACOS_REGISTER_IP}
      SEATA_PORT: 8091
      STORE_MODE: db
    volumes:
      - /usr/share/zoneinfo/Asia/Shanghai:/etc/localtime
      - /usr/share/zoneinfo/Asia/Shanghai:/etc/timezone
      - ./maozi-cloud-basic-seata/config/application.yml:/seata-server/resources/application.yml

  maozi-cloud-basic-xxljob:
    restart: always
    image: xuxueli/xxl-job-admin:3.4.2
    container_name: maozi-cloud-basic-xxljob
    environment:
      PARAMS: "--spring.datasource.url=jdbc:mysql://maozi-cloud-basic-mysql:3306/maozi-cloud-xxljob-middleware-db?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai --spring.datasource.username=root --spring.datasource.password=password"
      TZ: Asia/Shanghai
    volumes:
      - ./maozi-cloud-basic-xxljob/data:/data/applogs
    ports:
      - 12000:8080
    depends_on:
      maozi-cloud-basic-mysql:
        condition: service_healthy

  # SnailJob —— 分布式任务重试与调度平台
  # 部署文档: https://snailjob.opensnail.com/docs/guide/server/service_deployment.html
  # Web 控制台: http://localhost:8800/snail-job (默认账号 admin/admin)
  maozi-cloud-basic-snailjob:
    restart: always
    image: opensnail/snail-job:1.10.0
    container_name: maozi-cloud-basic-snailjob
    environment:
      TZ: Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_DATASOURCE_URL: jdbc:mysql://maozi-cloud-basic-mysql:3306/maozi-cloud-snailjob-middleware-db?useSSL=false&characterEncoding=utf8&useUnicode=true&serverTimezone=Asia/Shanghai
      # 屏蔽 Fory 序列化框架（SnailJob 底层依赖）的任务分发冗余日志：类注册告警/实例创建/序列化代码生成/白名单提示
      # relaxed binding: LOGGING_LEVEL_ORG_APACHE_FORY -> logging.level.org.apache.fory
      LOGGING_LEVEL_ORG_APACHE_FORY: ERROR
    ports:
      - 8800:8080     # Web 控制台
      - 17888:17888   # Netty 通信端口, 客户端(执行器)需能访问
    depends_on:
      maozi-cloud-basic-mysql:
        condition: service_healthy


# 外部网络：所有 Compose 通过该网络互通，启动前需先手动创建
networks:
  default:
    external:
      name: maozi-cloud-network