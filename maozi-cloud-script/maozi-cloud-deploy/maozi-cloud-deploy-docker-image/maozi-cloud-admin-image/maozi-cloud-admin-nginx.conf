# ============================================================
# maozi-cloud-admin 生产 Nginx 配置
# ------------------------------------------------------------
# 职责 (对应 vite.config.ts 生产注释要求的等效转发):
#   1. 托管 Vite 构建的静态资源 (dist), history 路由回退 index.html
#   2. /api/* 剥掉前缀转发业务网关 —— 生产 VITE_API_BASE_URL=/api,
#      与 SPA 页面路由 (/login /system/... 等) 解耦, 避免前缀冲突
#   3. /nacos/*   -> Nacos 控制台 (中间件管理页内嵌打开)
#   4. /grafana/* -> Grafana (容器已配 serve_from_sub_path)
# 上游地址均为 maozi-cloud-network 内容器服务名。
# ------------------------------------------------------------
# 单体模式注意: monomer-docker 模式下无独立网关容器,
# 需把 /api/ 的转发地址改为 maozi-cloud-service-monomer:1000
# ============================================================
server {
    listen 999;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 图片上传 /system/image/upload 为 multipart/form-data, 放宽请求体限制
    client_max_body_size 20m;

    # ---------- 静态资源 ----------
    # Vite 产物文件名带内容 hash, 可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- 业务 API: /api/* -> 网关 (剥掉 /api 前缀) ----------
    # proxy_pass 尾斜杠写法把 /api/oauth/x 映射为 /oauth/x
    location /api/ {
        proxy_pass http://maozi-cloud-gateway-service:1000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # ---------- Nacos 控制台同源代理 ----------
    # 前缀原样透传: Nacos 对无斜杠路径会 302 到绝对地址, 改写前缀会导致会话丢失
    location /nacos/ {
        proxy_pass http://maozi-cloud-basic-nacos:8848;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Grafana 同源代理 ----------
    # Grafana 已配置 GF_SERVER_SERVE_FROM_SUB_PATH=true, 按 /grafana 子路径服务
    location /grafana/ {
        proxy_pass http://maozi-cloud-basic-grafana:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- SPA history 路由回退 ----------
    # createWebHistory 模式: 刷新 /login /system/user 等深链必须回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
