spring:
  # 上传文件大小限制
  servlet:
    multipart:
      max-file-size: 1MB        # 单个文件大小上限
      max-request-size: 5MB     # 单次请求（multipart）总大小上限
  # AI 大模型接入配置（Spring AI），当前启用阿里云百炼，其余供应商注释备用
  ai:
    # 智谱 AI 配置（按需取消注释启用）
    # zhipuai:
    #   base-url: https://api.z.ai/api/paas          # Z.ai（智谱）开放平台 API 地址
    #   api-key:                                     # API 密钥
    #   chat:
    #     options:
    #       model: glm-5.2                           # 对话模型
    #   embedding:
    #     enabled: false                             # 是否启用向量嵌入
    # 阿里云百炼（DashScope）配置
    dashscope:
      api-key: ${AI_DASHSCOPE_KEY}                   # API 密钥（从环境变量注入）
      chat:
        enabled: true                                # 启用对话模型
        options:
          model: qwen-max                            # 文本对话模型
          text_image_model: qwen-vl-max              # 图生文模型（项目自定义键，带图对话时切换）
      embedding:
        enabled: false                               # 暂不启用向量嵌入
        options:
          model: text-embedding-v3                   # 向量嵌入模型
          dimensions: 1024                           # 向量输出维度
    # OpenAI 配置（按需取消注释启用）
    # openai:
    #   base-url:                                    # API 地址
    #   api-key:                                     # API 密钥
    #   chat:
    #     options:
    #       model: gpt                               # 对话模型
    #   embedding:
    #     enabled: false                             # 是否启用向量嵌入

# 图片存储配置（store-type 决定上传路由到的存储处理器，取值见 ImageStorageType 枚举 code）
oss:
  # 路由到阿里云处理器
  store-type: aliyun
  aliyun:
    # 访问凭证从环境变量注入，禁止硬编码
    access-key-id: ${ALIYUN_CLIENT_ID}                 # AccessKey ID
    access-key-secret: ${ALIYUN_CLIENT_SECRET}         # AccessKey Secret
    region: cn-beijing                                 # 地域（Region）
    endpoint: https://oss-cn-beijing.aliyuncs.com      # 访问域名（Endpoint）
    bucket: maozi-cloud-bucket                         # 存储空间（Bucket）
    #domain:                  # 可选，CDN 自定义域名