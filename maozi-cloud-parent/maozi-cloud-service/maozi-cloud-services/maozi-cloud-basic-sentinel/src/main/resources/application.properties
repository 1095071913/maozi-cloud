#spring settings
server.port=8858
# 子路径部署: 环境变量 API_BASE_PATH (如 /sentinel) 把控制台整体挂到该前缀下,
# nginx 侧 /sentinel/ 原样透传即可 (前端 AuthInterceptor 按 <base href="./">
# 自动为全部 $http 请求补前缀); 默认空 = 根路径部署, 行为不变
server.servlet.context-path=/sentinel
server.servlet.encoding.force=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true

#cookie name setting
server.servlet.session.cookie.name=sentinel_dashboard_cookie

#logging settings
logging.level.org.springframework.web=INFO
logging.file.name=${user.home}/logs/csp/sentinel-dashboard.log
logging.pattern.file= %d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
#logging.pattern.console= %d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

#auth settings
auth.filter.exclude-urls=/,/auth/login,/auth/logout,/registry/machine,/version
auth.filter.exclude-url-suffixes=htm,html,js,css,map,ico,ttf,woff,png
# If auth.enabled=false, Sentinel console disable login
auth.username=${AUTH_USERNAME:sentinel}
auth.password=${AUTH_PASSWORD:sentinel}

# Inject the dashboard version. It's required to enable
# filtering in pom.xml for this resource file.
sentinel.dashboard.version=@project.version@

#-------------------------------------------------------------------
# Metric persistence (MySQL)
#-------------------------------------------------------------------
# The database is auto-created on first connection (createDatabaseIfNotExist=true),
# the table and indexes are auto-created by schema.sql on startup.
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:maozi-cloud-basic-mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:maozi-cloud-sentinel-middleware-db}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:password}
spring.sql.init.mode=always

# Days to keep metric data in MySQL (expired data is cleaned up once a day, <=0 disables cleanup)
sentinel.metric.retention-days=${METRICE_RETENTION_DAYS:30}

# Metric aggregation granularity N (seconds): merge N seconds of per-second metrics into ONE
# stored row (timestamp aligned to the N-second grid, QPS fields normalized to per-second
# average), shrinking storage N times. 1 = keep original per-second storage.
sentinel.metric.aggregate-seconds=${METRIC_AGGREGATE_SECONDS:5}

#-------------------------------------------------------------------
# Rule persistence (Nacos)
#-------------------------------------------------------------------
# DataId of each rule type is {appName}-{ruleType}-rules.json under the group below,
# e.g. foo-app-flow-rules.json / foo-app-degrade-rules.json / foo-app-gw-flow-rules.json ...
# Config content is pretty-printed JSON, published with config type "json".
nacos.server-addr=${NACOS_SERVER:maozi-cloud-basic-nacos:8848}
nacos.namespace=${NACOS_NAMESPACE:middleware}
nacos.group=${NACOS_GROUP:SENTINEL_GROUP}