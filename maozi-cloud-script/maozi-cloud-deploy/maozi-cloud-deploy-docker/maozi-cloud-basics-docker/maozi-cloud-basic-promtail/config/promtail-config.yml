# ============================================================
# Promtail 配置 —— 采集 maozi-cloud 共享日志目录并推送至 Loki
# ------------------------------------------------------------
# 关键路径：
#   - 采集路径 /maozi-logs/*/*.log（由 docker-compose 挂载自宿主机共享目录）
#   - 推送目标 http://maozi-cloud-basic-loki:3100/loki/api/v1/push
#   - 采集位置持久化 /data/positions.yaml（容器内，挂载到宿主机 ./maozi-cloud-basic-promtail/data）
# ------------------------------------------------------------
# 解析逻辑：
#   1. multiline 把同一日志事件的多行(正文 + 异常堆栈)合并为一条;
#   2. regex 提取 logback-spring.xml 行内字段 + message + 可选 stack_trace;
#   3. level/service/environment 提升为 Loki 标签，便于按服务/级别筛选;
#   4. timestamp 使用日志行内时间(必须指定 location，详见下方注释);
#   5. template/output 把解析结果重组为 JSON 行，推送给 Loki 的即为 JSON 串。
# ============================================================
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /data/positions.yaml

clients:
  - url: http://maozi-cloud-basic-loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: maozi-cloud-logs
    static_configs:
      - targets:
          - localhost
        labels:
          __path__: /maozi-logs/*/*/*/*.log
    pipeline_stages:
      # multiline: 以 [ yyyy-MM-dd HH:mm:ss ] 开头的行视为新日志条目首行,
      # 后续的堆栈跟踪行(java.lang.Xxx / at com.xxx...)被合并到上一条
      - multiline:
          firstline: '^\[ \d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2} \]'
          max_wait_time: 1s

      # 解析 logback 日志行,在前缀字段之外,把 %m 整段(含外层 [ ] 包装、AOP 字段、可能的堆栈)都吃进 message
      # - logtime/level/tid/service/environment 用 [^\]]* 即可,这些字段不含 ]
      # - message 用 \[ [\s\S]* : \[ 匹配 logback 的 [ %m ] 中的左括号, [\s\S]* 跨行吃掉右括号后
      #   的所有内容包括异常堆栈(multiline 已把堆栈行合并进来),统一塞进 message 字段
      # - 不再单独抽 stack_trace,JSON 里只有一个 message 字段
      - regex:
          expression: '^\[ (?P<logtime>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) \]  \[ Level：(?P<level>\w+) \]  \[ TID：(?P<tid>[^\]]*) \]  \[ Service：(?P<service>[^\]]*) \]  \[ Environment：(?P<environment>[^\]]*) \]  (?P<message>\[ [\s\S]*)\s*$'

      # 把 level/service/environment 提升为 Loki 标签
      # (注意: Promtail 不会把它们写进日志正文,因此 JSON 行里需要再次显式写入)
      - labels:
          level:
          service:
          environment:

      # 用日志行里的时间作为 Loki 时间戳 (而非默认的接收时间)
      # location 必填: logback 时间是本地时间 (Asia/Shanghai, UTC+8), 不指定会被当 UTC → 比真实时间晚 8 小时 → Loki 判定 "timestamp too new" 拒收
      - timestamp:
          source: logtime
          format: '2006-01-02 15:04:05'
          location: Asia/Shanghai

      # 按 6 个核心字段构造 JSON 行
      # - toJson: Sprig 函数,自动处理字符串的 JSON 转义(引号/反斜杠/换行等)
      # - 异常堆栈已在 regex 阶段并入 message,JSON 里只保留一个 message 字段
      - template:
          source: json_line
          template: '{{ toJson (dict "timestamp" .logtime "level" .level "trace_id" .tid "service" .service "environment" .environment "message" .message) }}'

      # 用 JSON 替换原始日志行,推送给 Loki 的内容即为 JSON 串
      - output:
          source: json_line
