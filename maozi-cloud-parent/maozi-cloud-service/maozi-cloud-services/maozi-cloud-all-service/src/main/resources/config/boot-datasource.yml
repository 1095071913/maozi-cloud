# ============================================================
# 数据源配置（Hikari 连接池 + MySQL）
# 所有连接参数均可通过环境变量覆盖，未配置时使用冒号后的默认值。
# ============================================================
spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${application-datasource-jdbc-url:maozi-cloud-basic-mysql:3306}/${application-datasource-db-name:${spring.application.name}-${application.environment}-db}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&nullCatalogMeansCurrent=true
    username: ${application-datasource-jdbc-username:root}
    password: ${application-datasource-jdbc-password:password}
    hikari:
      # 最大连接，根据业务压测调整，默认推荐10~20，不要直接50
      maximum-pool-size: 15
      # 获取连接等待超时时间
      connection-timeout: 6000
      # 不配置minimum-idle，Hikari官方推荐，最小空闲连接等于最大连接
      # minimum-idle: 10
      # 空闲连接超时，注意必须小于max-lifetime
      idle-timeout: 300000
      # 连接最大存活时间，比mysql wait_timeout小至少60s，示例540s=9min
      max-lifetime: 540000
      # 删掉 connection-test-query，Hikari用JDBC4 isValid校验