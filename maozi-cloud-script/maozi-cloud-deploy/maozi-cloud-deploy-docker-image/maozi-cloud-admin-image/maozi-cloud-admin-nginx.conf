# ============================================================
# maozi-cloud-admin 生产 Nginx 配置
# ------------------------------------------------------------
# 职责 (对应 vite.config.ts 生产注释要求的等效转发):
#   1. 托管 Vite 构建的静态资源 (dist), history 路由回退 index.html
#   2. /api/* 剥掉前缀转发业务网关 —— 生产 VITE_API_BASE_URL=/api,
#      与 SPA 页面路由 (/login /system/... 等) 解耦, 避免前缀冲突
#   3. /nacos/*   -> Nacos 控制台 (中间件管理页内嵌打开)
#   4. /grafana/* -> Grafana (容器已配 serve_from_sub_path)
# 上游地址均为 maozi-cloud-network 内容器服务名。
# ------------------------------------------------------------
# /api/ 的转发地址由环境变量 API_BASE_PATH 在容器启动时注入
# (Dockerfile 把本文件放入 /etc/nginx/templates, nginx:alpine
#  入口脚本用 envsubst 渲染到 /etc/nginx/conf.d/default.conf),
# 单体/微服务模式只需在 compose 改 API_BASE_PATH, 无需重建镜像。
# ============================================================
server {
    listen ${APPLICATION_PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 图片上传 /system/image/upload 为 multipart/form-data, 放宽请求体限制
    client_max_body_size 20m;

    # ---------- 子路径直连: /admin/* 剥前缀 ----------
    # 前端按 base=/admin/ 构建, 直连本容器 (localhost:999) 时需先剥掉前缀;
    # rewrite last 重新走 location 匹配, /admin/assets/x -> /assets/x 命中下方静态缓存规则
    location /admin/ {
        rewrite ^/admin/?(.*)$ /$1 last;
    }

    # ---------- 静态资源 ----------
    # Vite 产物文件名带内容 hash, 可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- 业务 API: /api/* -> 网关 (剥掉 /api 前缀) ----------
    # proxy_pass 尾斜杠写法把 /api/oauth/x 映射为 /oauth/x
    # API_BASE_PATH 由容器环境变量注入 (不带尾斜杠), 如:
    #   http://maozi-cloud-gateway-service-dev-main:1100
    location /api/ {
        proxy_pass ${API_BASE_PATH}/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # ---------- 中间件同源代理 (admin 前端内嵌页, 前缀原样透传, 与外层入口一致) ----------
    # 直连本容器时 /nacos /grafana /snail-job 根路径请求打到本 nginx, 需等效转发
    location /nacos/ {
        proxy_pass http://maozi-cloud-basic-nacos:8848;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /grafana/ {
        proxy_pass http://maozi-cloud-basic-grafana:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /snail-job/ {
        proxy_pass http://maozi-cloud-basic-snailjob:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- SPA history 路由回退 ----------
    # createWebHistory 模式: 刷新 /login /system/user 等深链必须回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
